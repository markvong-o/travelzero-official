name: Deploy ACUL Screens to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'acul-templates/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: acul-templates

      - name: Build ACUL screens
        run: npm run build
        working-directory: acul-templates

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: acul-templates/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
